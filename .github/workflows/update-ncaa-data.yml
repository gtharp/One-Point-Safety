name: Update college data

# College football (NCAA FBS) data from the CollegeFootballData.com API.
# The free tier allows 1,000 calls per calendar month, so every run is
# budgeted (see scripts/build_ncaa_data.py and README.md):
#   - daily run: /games + /rankings + /plays for weeks with newly final
#     games (usually 1) -> typically 2-4 calls
#   - weekend runs (in season): /games + /plays for the current week only
#     -> 2 calls
# The script checks the free /info endpoint first and skips the run if
# fewer than 100 calls remain this month.
on:
  schedule:
    # Daily at 13:30 UTC, 30 minutes after update-data.yml (13:00) so the
    # two jobs never race on git push.
    - cron: "30 13 * * *"
    # Extra in-season runs (Sep-Jan) to pick up Saturday's games sooner:
    # Sun 04:30 UTC (~10:30-11:30pm Central Sat) and Sun 08:30 UTC (after
    # late West Coast kickoffs finish).
    - cron: "30 4 * 9-12,1 0"
    - cron: "30 8 * 9-12,1 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (default) or weekend (current week only)"
        required: false
        default: daily

permissions:
  contents: write

concurrency:
  group: update-ncaa-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build college data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE=daily
          case "$SCHEDULE" in
            "30 4 * 9-12,1 0"|"30 8 * 9-12,1 0") MODE=weekend ;;
          esac
          if [ "$INPUT_MODE" = "weekend" ]; then MODE=weekend; fi
          python3 scripts/build_ncaa_data.py --out data/ncaa --mode "$MODE"

      - name: Regenerate sitemap
        run: python3 scripts/build_seo.py --sitemap-only

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaa sitemap.xml scripts/sitemap_state.json
          if git diff --cached --quiet; then
            echo "No college data changes."
            exit 0
          fi
          git commit -m "Update college data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Pick up anything the NFL job (or a manual run) pushed meanwhile.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
