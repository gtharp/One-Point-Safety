name: Update rarity numbers

# Historical rarity barely changes within a season -- only once a
# completed season's data is final does the average move. Runs once a
# year after the season wraps, plus manual dispatch any time.
on:
  schedule:
    - cron: "0 13 1 3 *" # March 1, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compute rarity
        run: python3 scripts/build_rarity.py --out data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/rarity.json; then
            echo "No rarity changes."
            exit 0
          fi
          git add data/rarity.json
          git commit -m "Update rarity numbers ($(date -u +'%Y-%m-%d'))"
          git push
