name: Update weather records

# Like rarity, the "since 2002" weather records barely change mid-season --
# only a new record-setting game moves them. Runs once a year after the
# season wraps, plus manual dispatch any time.
on:
  schedule:
    - cron: "0 14 1 3 *" # March 1, 14:00 UTC (1hr after update-rarity.yml)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compute weather records
        run: python3 scripts/build_weather_records.py --out data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/weather_records.json; then
            echo "No weather record changes."
            exit 0
          fi
          git add data/weather_records.json
          git commit -m "Update weather records ($(date -u +'%Y-%m-%d'))"
          git push
